name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Check Obsidian plugin guidelines
        run: npm run lint

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node -e 'const manifest = require("./manifest.json"); const pkg = require("./package.json"); const version = process.env.RELEASE_VERSION; if (manifest.version !== version || pkg.version !== version) { throw new Error(`Tag ${version}, manifest ${manifest.version}, and package ${pkg.version} must match`); }'

      - name: Build production bundle
        run: npm run build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
